project:
  id: pew_atp_w152_ai_attitudes
  title: "Pew American Trends Panel Wave 152 AI Attitude Network"
  status: "public-source manifest; computation pending official microdata access"
  study_design: "Cross-sectional probability-based panel survey wave"
  interpretive_notice: "When official microdata are acquired, estimated edges will be undirected conditional associations among between-person responses. The CAN causal vocabulary is theoretical; a single Wave 152 network cannot establish temporal order, causal effects, or intervention effects."

source:
  provider: "Pew Research Center"
  wave: "American Trends Panel Wave 152"
  field_dates: "2024-08-12 to 2024-08-18"
  topics: "Artificial Intelligence (AI) and Human Enhancement"
  dataset_page: "https://www.pewresearch.org/dataset/american-trends-panel-wave-152/"
  report: "https://www.pewresearch.org/internet/2025/04/03/how-the-us-public-and-ai-experts-view-artificial-intelligence/"
  methodology: "https://www.pewresearch.org/internet/2025/04/03/us-public-and-ai-experts-methodology/"
  questionnaire: "https://www.pewresearch.org/wp-content/uploads/sites/20/2025/03/pi_2025.04.03_us-public-and-ai-experts_questionnaire.pdf"
  topline: "https://www.pewresearch.org/wp-content/uploads/sites/20/2025/03/pi_2025.04.03_us-public-and-ai-experts_topline.pdf"
  access_rule: "Official respondent-level files require a free, email-verified Pew Research Center account and acceptance of its Terms of Use. Do not redistribute downloaded microdata through this repository or Streamlit."

input:
  protected_local_folder: "data/external/pew_atp_w152/"
  accepted_formats: [csv, sav, rds, dta]
  expected_file: "Obtain through the official Pew Wave 152 dataset page after account verification; record filename and SHA-256 before analysis."
  questionnaire_local_copy: "data/external/pew_atp_w152/wave152_questionnaire.pdf"
  checksum_sha256: "Pending official download"

node_map_status:
  status: "Pre-specified from the public final questionnaire; verify exact exported column names and response codes against the official downloaded file before execution."
  missing_values: [98, 99]
  minimum_complete_cases: 3000
  minimum_category_events: 20
  no_results_before: "Variable-name verification, response-distribution audit, missing-data audit, and pre-specified feasibility gate."

network:
  planned_estimator: "Mixed graphical model (MGM) with LASSO/EBIC regularization"
  planned_node_type: "ordinal"
  planned_ebic_gamma: 0.25
  planned_nodes:
    - questionnaire_id: AI_HEARD
      label: "Heard or read about AI"
      domain: "AI exposure and personal orientation"
      universe: "All respondents"
    - questionnaire_id: USEAI
      label: "Perceived frequency of AI interaction"
      domain: "AI exposure and personal orientation"
      universe: "All respondents"
    - questionnaire_id: CNCEXC
      label: "Excited versus concerned about daily AI"
      domain: "AI exposure and personal orientation"
      universe: "All respondents"
    - questionnaire_id: AICONTROL1
      label: "Perceived control over AI use in own life"
      domain: "AI exposure and personal orientation"
      universe: "All respondents"
    - questionnaire_id: AICHANGE
      label: "Expected overall U.S. impact of AI"
      domain: "Societal consequences and personal benefit"
      universe: "All respondents"
    - questionnaire_id: PERSBENHRM
      label: "Expected personal benefit versus harm from AI"
      domain: "Societal consequences and personal benefit"
      universe: "All respondents"
    - questionnaire_id: AIJOBS
      label: "Expected overall AI jobs impact"
      domain: "Societal consequences and personal benefit"
      universe: "All respondents"
    - questionnaire_id: TRSTAIPRS
      label: "Trust AI for medical diagnosis"
      domain: "AI capability and future risk"
      universe: "All respondents"
    - questionnaire_id: FUTRAI_a
      label: "AI will think on its own"
      domain: "AI capability and future risk"
      universe: "All respondents"
    - questionnaire_id: FUTRAI_b
      label: "AI will cause major harm to humans"
      domain: "AI capability and future risk"
      universe: "All respondents"
    - questionnaire_id: FUTRAI_c
      label: "AI will make humans more productive"
      domain: "AI capability and future risk"
      universe: "All respondents"
    - questionnaire_id: FUTRAI_d
      label: "AI will make humans happier"
      domain: "AI capability and future risk"
      universe: "All respondents"
    - questionnaire_id: AIREG
      label: "Concern about insufficient AI regulation"
      domain: "Governance and institutional confidence"
      universe: "All respondents"
    - questionnaire_id: REGCONFG
      label: "Confidence in government AI regulation"
      domain: "Governance and institutional confidence"
      universe: "All respondents"
    - questionnaire_id: REGCONFI
      label: "Confidence in companies using AI responsibly"
      domain: "Governance and institutional confidence"
      universe: "All respondents"

feasibility_gate:
  required_checks:
    - "Exact exported variable names and values match the official documentation."
    - "All selected items are present for the all-respondent universe after documented 98/99 nonresponse recoding."
    - "At least 3,000 complete cases and no selected variable with an uninformative response distribution."
    - "No estimand change is concealed by form assignment or conditional routing."
    - "Primary regularized network is not saturated and has interpretable domain structure."
    - "Split-sample, regularization, weighting, and item-set sensitivities are documented before public results are shown."
  outcome_if_failed: "Retain a transparent source/mapping pathway but do not display a substantive network or publication-oriented interpretation."

planned_outputs:
  public_streamlit_mode: "Source, questionnaire, mapping, access, and feasibility gate only until official microdata are acquired and pass validation."
  local_full_mode: "Checksum verification, data audit, analysis, diagnostics, and results generation after official download."
