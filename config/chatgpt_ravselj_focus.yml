project:
  id: chatgpt_ravselj_focus
  title: "ChatGPT perceptions: focused CAN example"
  seed: 20260819
  study_design: "Cross-sectional survey"
  interpretive_notice: "This is a theory-led cross-sectional CAN-informed network. Its undirected edges are conditional associations and do not establish directional causal effects."
input:
  path: data/raw/chatgpt_ravselj_2025/final_dataset.xlsx
  sheet: final dataset
  format: xlsx
  questionnaire: data/raw/chatgpt_ravselj_2025/questionnaire.pdf
  source_doi: "10.17632/ymg9nsn6kn.2"
  source_license: "CC BY 4.0"
audit:
  mardia_max_n: 2000
sample:
  filter:
    variable: Q13
    operator: equals
    value: 1
    label: "Respondents reporting prior ChatGPT use"
  complete_case_primary_network: true
variables:
  country: Q4
  language: ""
  study_field: Q10
  gender: Q2
  age: Q3
  use_frequency: Q15
  use_experience: ""
network:
  estimator: mgm
  regularization: LASSO
  model_selection: EBIC
  ebic_gamma: 0.5
  # A conservative pre-specified lower bound prevents an effectively unpenalized
  # candidate from dominating this large-sample illustrative network.
  lambda_min_ratio: 0.25
  node_type: ordinal
  node_levels: 5
  nodes:
    - id: Q15
      label: "General ChatGPT use"
      domain: Behaviour
      node_type: ordinal
      levels: 5
    - id: Q18a
      label: "Use for academic writing"
      domain: Behaviour
      node_type: ordinal
      levels: 5
    - id: Q18l
      label: "Use for coding"
      domain: Behaviour
      node_type: ordinal
      levels: 5
    - id: Q19d
      label: "Efficient information"
      domain: Beliefs
      node_type: ordinal
      levels: 5
    - id: Q19g
      label: "Simplifies complex information"
      domain: Beliefs
      node_type: ordinal
      levels: 5
    - id: Q21c
      label: "University ethical guidance"
      domain: Governance
      node_type: ordinal
      levels: 5
    - id: Q22e
      label: "Inaccurate-information risk"
      domain: Risk appraisal
      node_type: ordinal
      levels: 5
    - id: Q22f
      label: "Privacy risk"
      domain: Risk appraisal
      node_type: ordinal
      levels: 5
    - id: Q24f
      label: "Satisfaction with information quality"
      domain: Evaluations
      node_type: ordinal
      levels: 5
    - id: Q25b
      label: "ChatGPT is interesting"
      domain: Evaluations
      node_type: ordinal
      levels: 5
    - id: Q26e
      label: "Expected study efficiency"
      domain: Expected outcomes
      node_type: ordinal
      levels: 5
    - id: Q26g
      label: "Expected study completion"
      domain: Expected outcomes
      node_type: ordinal
      levels: 5
    - id: Q32b
      label: "Hopeful while using ChatGPT"
      domain: Feelings
      node_type: ordinal
      levels: 5
    - id: Q32j
      label: "Anxious while using ChatGPT"
      domain: Feelings
      node_type: ordinal
      levels: 5
    - id: Q32n
      label: "Confused while using ChatGPT"
      domain: Feelings
      node_type: ordinal
      levels: 5
    - id: Q32o
      label: "Frustrated while using ChatGPT"
      domain: Feelings
      node_type: ordinal
      levels: 5
factor_models: []
bootstrapping:
  edge_bootstrap_iterations: 250
  case_drop_bootstrap_iterations: 250
  case_drop_proportions: [0.05, 0.10, 0.25, 0.50, 0.75]
community_detection:
  primary_algorithm: walktrap
  bootstrap_consensus_iterations: 100
comparisons:
  split_sample:
    enabled: true
    proportion_first_sample: 0.5
    label: "Random split-sample replication check"
  use_frequency_median_split:
    enabled: false
    variable: Q15
    exclude_from_network: true
    label: "Use-frequency comparison; Q15 excluded from compared networks"
  country:
    enabled: false
    variable: Q4
    minimum_n: 500
    network_estimator: ggm_spearman
    all_pairwise_nct: true
    nct_iterations: 1000
    p_adjustments: [bonferroni, fdr]
  networktree:
    enabled: false
    moderators: [Q2, Q10]
contextual_associations:
  categorical_variables: [Q2, Q4, Q10]
  effect_size: cramers_v
output:
  computations_dir: new_computations/chatgpt_ravselj_focus
  figures_dir: figures/chatgpt_ravselj_focus
  report_dir: reports/chatgpt_ravselj_focus
  save_rds: true
  save_csv: true
  figure_width: 14
  figure_height: 11
  figure_dpi: 180
