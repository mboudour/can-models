project:
  id: ess_cronos3_green_transition_w6
  title: "ESS CRONOS-3 Wave 6 Green Transition Attitude Network"
  seed: 20260819
  study_design: "Longitudinal or panel study"
  interpretive_notice: "This Wave 6 study estimates between-person conditional-association networks within a panel survey. Its undirected edges do not establish temporal order, within-person effects, or verified causal effects. A temporal extension requires documented item overlap in later released waves and a pre-specified longitudinal model."

input:
  path: data/external/ess_cronos3_sogreen/CRON3w6e01.csv
  sheet: ""
  format: csv
  questionnaire: data/external/ess_cronos3_sogreen/CRON3w6e01 codebook.html
  source_doi: https://doi.org/10.21338/cron3w6e01
  source_license: "ESS data: CC BY-NC-SA 4.0. Do not distribute through this repository or app; download the official file from the ESS Data Portal."
  expected_checksum_sha256: "0a3a647e1b530e33a0e542ce573e53aa4449fba49856af097bb1cdac15b3fe59"

audit:
  mardia_max_n: 2000

preprocessing:
  missing_values:
    - variables: [w6sgq2, w6sgq6, w6sgq9, w6sgq11, w6sgq12, w6seq2, w6sgq13, w6seq4, w6sgq14, w6sgq15, w6sgq16, w6sgq17, w6sgq21, w6sgq22, w6sgq23]
      values: [9, 99]
  collapse_values:
    - variable: w6sgq16
      from: [5]
      to: 4
    - variable: w6sgq17
      from: [5]
      to: 4

sample:
  filter:
    variable: ""
    operator: equals
    value: ""
    label: "All released CRONOS-3 Wave 6 respondents"
  complete_case_primary_network: true

variables:
  country: cntry
  language: ""
  study_field: ""
  gender: gndr
  age: w6age
  subjective_social_status: hincfel
  religion: ""
  education: eduyrs
  political_orientation: ""
  use_frequency: ""
  use_experience: ""

network:
  estimator: mgm
  regularization: LASSO
  model_selection: EBIC
  ebic_gamma: 0.25
  node_type: ordinal
  node_levels: 5
  minimum_category_events: 2
  nodes:
    - id: w6sgq2
      label: Local air-pollution concern
      domain: Environmental encounter
      node_type: ordinal
      levels: 5
    - id: w6sgq6
      label: Public-transport use
      domain: Green behaviour and engagement
      node_type: ordinal
      levels: 5
    - id: w6sgq9
      label: Energy-efficient appliance choice
      domain: Green behaviour and engagement
      node_type: ordinal
      levels: 5
    - id: w6sgq11
      label: Climate-change worry
      domain: Affective appraisal and responsibility
      node_type: ordinal
      levels: 5
    - id: w6sgq12
      label: Personal responsibility to reduce climate change
      domain: Affective appraisal and responsibility
      node_type: ordinal
      levels: 11
    - id: w6seq2
      label: Worry about local extreme weather
      domain: Affective appraisal and responsibility
      node_type: ordinal
      levels: 5
    - id: w6seq1_1
      label: Experienced severe flooding
      domain: Environmental encounter
      node_type: ordinal
      levels: 2
    - id: w6seq1_2
      label: Experienced drought
      domain: Environmental encounter
      node_type: ordinal
      levels: 2
    - id: w6seq1_3
      label: Experienced wildfire
      domain: Environmental encounter
      node_type: ordinal
      levels: 2
    - id: w6seq1_4
      label: Experienced heavy storm
      domain: Environmental encounter
      node_type: ordinal
      levels: 2
    - id: w6seq1_5
      label: Experienced extended extreme heat
      domain: Environmental encounter
      node_type: ordinal
      levels: 2
    - id: w6sgq13
      label: Trust in government to address climate change
      domain: Institutional capacity and policy legitimacy
      node_type: ordinal
      levels: 5
    - id: w6seq4
      label: Government preparedness for extreme weather
      domain: Institutional capacity and policy legitimacy
      node_type: ordinal
      levels: 5
    - id: w6sgq14
      label: Environment versus economic-growth priority
      domain: Institutional capacity and policy legitimacy
      node_type: ordinal
      levels: 2
    - id: w6sgq15
      label: Familiarity with national climate policies
      domain: Institutional capacity and policy legitimacy
      node_type: ordinal
      levels: 4
    - id: w6sgq16
      label: Confidence policies consider everyone views
      domain: Institutional capacity and policy legitimacy
      node_type: ordinal
      levels: 4
    - id: w6sgq17
      label: Confidence in fair climate-policy outcomes
      domain: Institutional capacity and policy legitimacy
      node_type: ordinal
      levels: 4
    - id: w6sgq21
      label: Concern about ability to pay energy bills
      domain: Personal transition-cost concerns
      node_type: ordinal
      levels: 5
    - id: w6sgq22
      label: Concern about increased transport costs
      domain: Personal transition-cost concerns
      node_type: ordinal
      levels: 5
    - id: w6sgq23
      label: Concern about future job loss
      domain: Personal transition-cost concerns
      node_type: ordinal
      levels: 6
    - id: w6vq5_2
      label: Participated in an environmental-protection organisation
      domain: Green behaviour and engagement
      node_type: ordinal
      levels: 2

factor_models:
  - id: policy_legitimacy
    label: "Policy legitimacy and governmental capacity"
    items: [w6sgq13, w6sgq16, w6sgq17]
    estimator: MLR
    minimum_cfi: 0.90
    maximum_rmsea: 0.08
    country_invariance: true
  - id: personal_transition_cost
    label: "Perceived personal transition cost"
    items: [w6sgq21, w6sgq22, w6sgq23]
    estimator: MLR
    minimum_cfi: 0.90
    maximum_rmsea: 0.08
    country_invariance: true

bootstrapping:
  edge_bootstrap_iterations: 1000
  case_drop_bootstrap_iterations: 1000
  case_drop_proportions: [0.05, 0.10, 0.25, 0.50, 0.75]

community_detection:
  primary_algorithm: walktrap
  bootstrap_consensus_iterations: 1000

comparisons:
  split_sample:
    enabled: true
    proportion_first_sample: 0.50
    label: "Pre-specified split-sample reproducibility check; not a longitudinal or causal comparison"
  use_frequency_median_split:
    enabled: false
    variable: ""
    exclude_from_network: true
    label: "Not applicable to the Green Transition Attitude Network"
  country:
    enabled: true
    variable: cntry
    minimum_n: 400
    network_estimator: mgm
    all_pairwise_nct: true
    nct_iterations: 1000
    p_adjustments: [bonferroni, fdr]
  networktree:
    enabled: false
    moderators: []

contextual_associations:
  categorical_variables: [cntry, gndr]
  effect_size: cramers_v

output:
  computations_dir: new_computations/ess_cronos3_green_transition_w6
  figures_dir: figures/ess_cronos3_green_transition_w6
  report_dir: reports/ess_cronos3_green_transition_w6
  save_rds: true
  save_csv: true
  figure_width: 16
  figure_height: 12
  figure_dpi: 180
